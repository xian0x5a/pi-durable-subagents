name: Release

on:
  push:
    # Stable semver only, with or without a leading v; pre-release tags
    # (1.2.3-beta.1) do not match, so they never publish to npm `latest`.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  # Started on a tag by the Release on merge workflow. The tag check below
  # refuses any other ref before anything is published.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # The engines floor; local development covers newer Node.
          node-version: '22'
          # Release builds must not restore a cache another workflow could have written.
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      # The process suite launches real Pi processes and PTYs; it stays a local gate.
      - run: npm run test:ci

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing (OIDC); also signs provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing needs npm >= 11.5.1, which Node 24 bundles.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package version
        run: |
          # A dispatch bypasses the push filter above, so recheck that the ref
          # is a stable version tag.
          if [ "${GITHUB_REF_TYPE}" != tag ] || ! [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not a stable version tag"
            exit 1
          fi
          package_version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "${package_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}"
            exit 1
          fi
      # Skip a version already on npm: the first release is published by hand
      # (Trusted Publishing needs an existing package), and reruns stay safe.
      - name: Publish to npm
        run: |
          package_spec="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "${package_spec}" version > /dev/null 2>&1; then
            echo "${package_spec} is already published; skipping npm publish"
          else
            npm publish
          fi
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The Release on merge workflow starts this run with its own token, so no
  # person is notified of a failure; an issue is.
  report-failure:
    needs: [check, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: >-
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Release ${GITHUB_REF_NAME} failed"
          --body "The Release workflow failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}
